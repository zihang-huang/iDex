# Runs the test suite on the iPhone Duo simulator, then builds an unsigned IPA
# for re-signing with a personal Apple ID (e.g. Sideloadly on Windows).
name: Build and test

on:
  push:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Also run the UI tests (slower)
        type: boolean
        default: true
      bundle_id:
        description: Bundle ID for the IPA (empty = io.github.<owner>.idex)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard Apple Silicon runner (free on public repositories); not the billed -xlarge one.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      DESTINATION: platform=iOS Simulator,name=iPhone Duo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -list -project iDex.xcodeproj

      # The hosted simulator never starts AVSpeechSynthesizer output (isSpeaking stays false on
      # every run, and the unmodified upstream app crashes in the audio engine there), so the two
      # speech-startup tests are skipped in CI only. Speech is verified on the physical device.
      - name: Unit tests
        run: |
          mkdir -p artifacts
          xcodebuild test -quiet \
            -project iDex.xcodeproj -scheme iDex -destination "$DESTINATION" \
            -only-testing:iDexTests -resultBundlePath artifacts/unit-tests.xcresult \
            -skip-testing:"iDexTests/AudioPlaybackTests/silentNativeSpeechReportsItsActualStartAndFinish()" \
            -skip-testing:"iDexTests/ScanResponsivenessTests/fullScanKeepsRenderingThroughSpeechStartup(language:)" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""

      # Later steps still run after a test failure, so the IPA and UI results are not held back;
      # the job itself still ends as failed.
      - name: UI tests
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.run_ui_tests) }}
        run: |
          xcodebuild test -quiet \
            -project iDex.xcodeproj -scheme iDex -destination "$DESTINATION" \
            -only-testing:iDexUITests -resultBundlePath artifacts/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""

      # Annotations are readable through the public API without signing in, unlike the logs.
      - name: Report test failures
        if: ${{ !cancelled() }}
        run: |
          for bundle in artifacts/*.xcresult; do
            [ -d "$bundle" ] || continue
            python3 - "$bundle" <<'PY'
          import json, os, re, subprocess, sys
          bundle = sys.argv[1]
          def run(*arguments):
              out = subprocess.run(['xcrun', 'xcresulttool', 'get', *arguments, '--path', bundle],
                                   capture_output=True, text=True, encoding='utf-8')
              if out.returncode or not out.stdout.strip():
                  print(f'::warning::xcresulttool {" ".join(arguments)} failed for {bundle}: {out.stderr.strip()[:300]}')
                  return {}
              return json.loads(out.stdout)
          def result(kind):
              return run('test-results', kind)
          # The legacy root record's failure summaries carry the source file and line.
          def located_failures():
              values = run('object', '--legacy', '--format', 'json').get('issues', {}).get('testFailureSummaries', {}).get('_values', [])
              found = []
              for value in values:
                  url = value.get('documentLocationInCreatingWorkspace', {}).get('url', {}).get('_value', '')
                  line = re.search(r'StartingLineNumber=(\d+)', url)
                  where = url.split('#')[0].rsplit('/', 1)[-1] + (f' line {int(line.group(1)) + 1}' if line else '') if url else ''
                  text = value.get('message', {}).get('_value', '')
                  found.append((value.get('testCaseName', {}).get('_value', ''), f'{where}: {text}' if where else text))
              return found
          def message(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def prop(value):
              return message(value).replace(':', '%3A').replace(',', '%2C')
          summary_data = result('summary')
          name = os.path.basename(bundle).split('.')[0]
          totals = {key: summary_data.get(key) for key in ('result', 'passedTests', 'failedTests', 'skippedTests')}
          print(name, totals)
          failures = located_failures()
          def walk(node, test=''):
              if node.get('nodeType') == 'Test Case':
                  test = node.get('nodeIdentifier') or node.get('name', '')
              if node.get('nodeType') == 'Failure Message':
                  failures.append((test, node.get('name', '')))
              for child in node.get('children', []):
                  walk(child, test)
          if not failures:
              for node in result('tests').get('testNodes', []):
                  walk(node)
          if not failures:
              failures = [(f"{f.get('targetName', '')}/{f.get('testName', '')}", f.get('failureText', ''))
                          for f in summary_data.get('testFailures', [])]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### {name}: {totals}\n')
              for test, text in failures:
                  print(f'::error title={prop(test)}::{message(text[:2000])}')
                  summary.write(f'- `{test}`: {text}\n')
          PY
          done

      # "Application does not have a process ID" usually means the app crashed; surface the
      # simulator's crash reports (exception and top frames) as public annotations too.
      - name: Report app crashes
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          reports = sorted(glob.glob(os.path.expanduser('~/Library/Logs/DiagnosticReports/iDex*.ips')), key=os.path.getmtime)
          print(f'{len(reports)} iDex crash report(s)')
          def message(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for path in reports[-5:]:
              try:
                  report = json.loads(open(path, encoding='utf-8').read().split('\n', 1)[1])
                  exception = report.get('exception', {})
                  thread = report.get('threads', [])[report.get('faultingThread', 0)]
                  images = report.get('usedImages', [])
                  frames = [f"{images[f.get('imageIndex', 0)].get('name', '?') if images else '?'} {f.get('symbol', '?')}"
                            for f in thread.get('frames', [])[:14]]
                  text = f"{exception.get('type')} {exception.get('signal')} {report.get('termination', {}).get('indicator', '')}\n" + '\n'.join(frames)
              except Exception as error:
                  text = f'unreadable crash report: {error}'
              print(f'::error title=App crash {os.path.basename(path)}::{message(text[:2000])}')
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve bundle ID
        if: ${{ !cancelled() }}
        id: meta
        env:
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bundle_id="$INPUT_BUNDLE_ID"
          if [ -z "$bundle_id" ]; then
            bundle_id="io.github.$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]').idex"
          fi
          if ! printf '%s' "$bundle_id" | grep -Eq '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'; then
            echo "::error::Invalid bundle ID: $bundle_id"
            exit 1
          fi
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The project ships no shared scheme for device builds, so build the app target directly.
      - name: Build app (unsigned)
        if: ${{ !cancelled() }}
        env:
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
        run: |
          xcodebuild build -quiet \
            -project iDex.xcodeproj -target iDex -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        if: ${{ !cancelled() }}
        id: pkg
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          app=$(find build -maxdepth 2 -type d -name '*.app' -path '*Release-iphoneos*' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under build/"
            exit 1
          fi
          if [ -z "$(find "$app" -maxdepth 1 -name '*.mlmodelc')" ]; then
            echo "::error::Compiled Core ML model missing from $app"
            exit 1
          fi
          plutil -p "$app/Info.plist" | grep -E '"(CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion)"'
          ipa="$GITHUB_WORKSPACE/iDex-$SHA-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry "$ipa" Payload
          du -h "$ipa"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.ipa }}
          archive: false
          if-no-files-found: error
          retention-days: 14
