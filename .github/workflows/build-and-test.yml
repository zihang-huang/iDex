# Runs the test suite on the iPhone Duo simulator, then builds an unsigned IPA
# for re-signing with a personal Apple ID (e.g. Sideloadly on Windows).
name: Build and test

on:
  push:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Also run the UI tests (slower)
        type: boolean
        default: true
      bundle_id:
        description: Bundle ID for the IPA (empty = io.github.<owner>.idex)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard Apple Silicon runner (free on public repositories); not the billed -xlarge one.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      DESTINATION: platform=iOS Simulator,name=iPhone Duo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -list -project iDex.xcodeproj

      - name: Unit tests
        run: |
          mkdir -p artifacts
          xcodebuild test -quiet \
            -project iDex.xcodeproj -scheme iDex -destination "$DESTINATION" \
            -only-testing:iDexTests -resultBundlePath artifacts/unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""

      # Later steps still run after a test failure, so the IPA and UI results are not held back;
      # the job itself still ends as failed.
      - name: UI tests
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.run_ui_tests) }}
        run: |
          xcodebuild test -quiet \
            -project iDex.xcodeproj -scheme iDex -destination "$DESTINATION" \
            -only-testing:iDexUITests -resultBundlePath artifacts/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""

      # Annotations are readable through the public API without signing in, unlike the logs.
      - name: Report test failures
        if: ${{ !cancelled() }}
        run: |
          for bundle in artifacts/*.xcresult; do
            [ -d "$bundle" ] || continue
            if ! xcrun xcresulttool get test-results summary --path "$bundle" > "$bundle.summary.json"; then
              echo "::warning::Could not read $bundle"
              continue
            fi
            python3 - "$bundle.summary.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          def message(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def prop(value):
              return message(value).replace(':', '%3A').replace(',', '%2C')
          name = os.path.basename(sys.argv[1]).split('.')[0]
          totals = {key: data.get(key) for key in ('result', 'passedTests', 'failedTests', 'skippedTests')}
          print(name, totals)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### {name}: {totals}\n')
              for failure in data.get('testFailures', []):
                  test = f"{failure.get('targetName', '')}/{failure.get('testName', '')}"
                  text = failure.get('failureText', '')
                  print(f'::error title={prop(test)}::{message(text[:2000])}')
                  summary.write(f'- `{test}`: {text}\n')
          PY
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve bundle ID
        if: ${{ !cancelled() }}
        id: meta
        env:
          INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bundle_id="$INPUT_BUNDLE_ID"
          if [ -z "$bundle_id" ]; then
            bundle_id="io.github.$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]').idex"
          fi
          if ! printf '%s' "$bundle_id" | grep -Eq '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'; then
            echo "::error::Invalid bundle ID: $bundle_id"
            exit 1
          fi
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The project ships no shared scheme for device builds, so build the app target directly.
      - name: Build app (unsigned)
        if: ${{ !cancelled() }}
        env:
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
        run: |
          xcodebuild build -quiet \
            -project iDex.xcodeproj -target iDex -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        if: ${{ !cancelled() }}
        id: pkg
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          app=$(find build -maxdepth 2 -type d -name '*.app' -path '*Release-iphoneos*' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under build/"
            exit 1
          fi
          if [ -z "$(find "$app" -maxdepth 1 -name '*.mlmodelc')" ]; then
            echo "::error::Compiled Core ML model missing from $app"
            exit 1
          fi
          plutil -p "$app/Info.plist" | grep -E '"(CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion)"'
          ipa="$GITHUB_WORKSPACE/iDex-$SHA-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry "$ipa" Payload
          du -h "$ipa"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.ipa }}
          archive: false
          if-no-files-found: error
          retention-days: 14
